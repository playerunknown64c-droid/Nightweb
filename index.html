<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NightWeb PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: dark crimson web world. Full-bleed hero with ink drip, tool tiles in a 2-col grid, tool screens as stacked panels. */
:root{
  --bg:#0a0507;--bg2:#12070b;--panel:#170a0f;--panel2:#210e15;--line:#35151f;
  --fg:#f4ecee;--mute:#a68e94;--accent:#e5173f;--accent2:#ff4d6d;--onaccent:#fff;
  --web:rgba(255,255,255,.075);--ok:#35d49a;--warn:#ffb020;--bad:#ff6178;
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --display:'Bebas Neue','Impact','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f8f2f3;--bg2:#f0e6e8;--panel:#ffffff;--panel2:#fbf4f5;--line:#e6d4d8;
  --fg:#1a0d11;--mute:#6f5a60;--accent:#c80f33;--accent2:#e5173f;
  --web:rgba(120,20,40,.12);--ok:#118a63;--warn:#b86e00;--bad:#c5223c;
  --shadow:0 10px 26px rgba(80,10,25,.14);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
#web{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#web *{stroke:var(--web);fill:none;stroke-width:1}
main{position:relative;z-index:1;max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent2)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{font:400 26px/1 var(--display);letter-spacing:.06em}
.brand b i{font-style:normal;color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.backbtn{display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;width:auto}

/* hero */
.hero{padding:26px 0 8px;position:relative}
.hero h1{font:400 clamp(46px,15vw,92px)/.9 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 28px rgba(229,23,63,.55)}
.hero p{margin:12px 0 0;color:var(--mute);max-width:34ch}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);letter-spacing:.02em}
.pill b{color:var(--accent2)}
.drip{display:block;width:calc(100% + 32px);margin:18px -16px 0;height:64px}
.drip path,.drip circle{fill:var(--accent)}
.drip{filter:drop-shadow(0 0 10px rgba(229,23,63,.45))}

/* search + chips */
.search{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--line);background:var(--panel) no-repeat 13px center;color:var(--fg);font:inherit}
.search::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}

/* tiles */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h2{font:400 22px/1 var(--display);letter-spacing:.08em;margin:0;text-transform:uppercase}
.sec span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:128px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 14px transparent,0 0 0 15px var(--line);opacity:.55}
.tile:hover,.tile:active{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px rgba(229,23,63,.22)}
.tile .ti{width:38px;height:38px;border-radius:11px;background:rgba(229,23,63,.14);color:var(--accent2);display:grid;place-items:center}
.tile .ti svg{width:21px;height:21px}
.tile b{font-size:14px;font-weight:700;line-height:1.2}
.tile small{color:var(--mute);font-size:12px;line-height:1.35}
.empty{color:var(--mute);padding:26px 0;text-align:center}

/* recent */
.recent{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;text-align:left;width:100%}
.rec div{min-width:0;flex:1}
.rec b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{color:var(--mute);font-size:12px}
.foot{margin-top:30px;color:var(--mute);font-size:12px;text-align:center;line-height:1.6}

/* tool screens */
.thead{display:flex;gap:12px;align-items:center;padding:8px 0 14px}
.thead .ti{width:48px;height:48px;border-radius:14px;background:rgba(229,23,63,.16);color:var(--accent2);display:grid;place-items:center;flex:none}
.thead .ti svg{width:26px;height:26px}
.thead h1{font:400 32px/1 var(--display);letter-spacing:.05em;margin:0;text-transform:uppercase}
.thead p{margin:3px 0 0;color:var(--mute);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;min-width:0}
.panel h3{margin:0 0 10px;font:400 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.drop{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border:1.5px dashed var(--accent);border-radius:16px;background:rgba(229,23,63,.06);text-align:center;margin-bottom:12px}
.drop svg{width:34px;height:34px;color:var(--accent2)}
.drop b{font-size:15px}
.drop span{color:var(--mute);font-size:12px}
.drop.over{background:rgba(229,23,63,.16)}
.fcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;margin-bottom:12px}
.fcard .fi{width:40px;height:40px;border-radius:10px;background:rgba(229,23,63,.16);color:var(--accent2);display:grid;place-items:center;flex:none;font:400 15px var(--display);letter-spacing:.05em}
.fcard div{min-width:0;flex:1}
.fcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.fcard small{color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--accent);color:var(--onaccent);box-shadow:0 8px 22px rgba(229,23,63,.35)}
.btn.small{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.grow>*{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.fld small{color:var(--mute);font-size:12px}
input[type=text],input[type=search]:not(.search),input[type=number],input[type=password],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;min-width:0}
textarea{min-height:150px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv{float:right;color:var(--fg);letter-spacing:0;text-transform:none}
.note{font-size:12px;color:var(--mute);margin:8px 0 0;line-height:1.5}
.note b{color:var(--warn)}

/* page grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pc{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px;display:flex;flex-direction:column;gap:6px;user-select:none}
.pc.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(229,23,63,.35)}
.pc .pv{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:#fff}
.pc img{max-width:100%;max-height:100%;transition:transform .2s}
.pc .pn{font-size:11px;color:var(--mute);text-align:center}
.pc .ctl{display:flex;gap:4px;justify-content:center}
.pc .ctl button{flex:1;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:4px 0;font-size:13px;line-height:1}
.pc .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:none;place-items:center;font-weight:700}
.pc.sel .tick{display:grid}

/* image list */
.ilist{display:flex;flex-direction:column;gap:8px}
.irow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.irow img{width:48px;height:60px;object-fit:cover;border-radius:6px;background:#fff;flex:none}
.irow div{flex:1;min-width:0}
.irow b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow small{color:var(--mute)}

/* result */
.result{border:1px solid var(--ok);background:linear-gradient(160deg,rgba(53,212,154,.10),transparent);border-radius:16px;padding:14px;margin:14px 0;display:flex;flex-direction:column;gap:6px}
.result .ok{color:var(--ok);font:400 22px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.result .rname{font-weight:700;word-break:break-all}
.result .rmeta{color:var(--mute);font-size:13px}
.result canvas{border-radius:8px;border:1px solid var(--line);max-width:150px;align-self:flex-start;margin:6px 0}
.result .row{margin-top:6px}

/* stage / annotator */
.stagehost{width:100%;overflow:hidden}
.stage{position:relative;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.stage canvas{display:block}
.ov{position:absolute;inset:0;cursor:crosshair}
.ov .it{position:absolute;pointer-events:none}
.ov .it.t{white-space:nowrap;line-height:1.1;font-family:Helvetica,Arial,sans-serif}
.ov .it.h{mix-blend-mode:multiply}
.ov .it.s img{width:100%;height:100%}
.sigpad{width:100%;height:150px;border:1.5px dashed var(--accent);border-radius:12px;background:#fff;touch-action:none;display:block}
.itemrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:13px}
.itemrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cropwrap{position:relative;width:min(100%,260px);margin:0 auto 12px}
.cropwrap canvas{width:100%;display:block;border-radius:6px}
.cropwrap .cm{position:absolute;background:rgba(229,23,63,.38);pointer-events:none}

/* viewer */
.vpages{display:flex;flex-direction:column;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.vpage{background:#fff;border-radius:4px;box-shadow:var(--shadow);flex:none;position:relative}
.vpage canvas{display:block}
.vpage .vn{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.hit{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;margin-top:6px;font-size:13px}
.hit b{color:var(--accent2)}
.hit mark{background:rgba(229,23,63,.35);color:inherit;border-radius:3px}

/* diff */
.dl{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;padding:1px 8px;border-radius:4px;margin-top:2px}
.dl.add{background:rgba(53,212,154,.16);color:var(--ok)}
.dl.del{background:rgba(255,97,120,.16);color:var(--bad)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.badge.same{background:rgba(53,212,154,.15);color:var(--ok)}
.badge.chg{background:rgba(255,176,32,.16);color:var(--warn)}
details.pg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--panel2)}
details.pg summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}

/* overlays */
#busy{position:fixed;inset:0;z-index:50;background:rgba(5,2,3,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(3px)}
#busy.on{display:flex}
#busy .ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent2);animation:spin .8s linear infinite;box-shadow:0 0 24px rgba(229,23,63,.5)}
#busy p{margin:0;color:#fff;font-weight:600;text-align:center;padding:0 24px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--panel2);border:1px solid var(--accent);color:var(--fg);padding:12px 16px;border-radius:12px;z-index:60;max-width:min(92vw,420px);text-align:center;transition:.25s;pointer-events:none;box-shadow:var(--shadow);font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>
<body>
<svg id="web" aria-hidden="true"></svg>
<main id="app"></main>
<div id="busy" role="status"><div class="ring"></div><p id="busyt">Working…</p></div>
<div id="toast" role="alert"></div>
<script>

    const relF = f.replace('slides/', 'slides/_rels/') + '.rels';
    if (zip.file(relF)) {
      const rel = new DOMParser().parseFromString(await zip.file(relF).async('string'), 'application/xml');
      for (const r of rel.getElementsByTagName('Relationship')) {
        if (!/image/.test(r.getAttribute('Type') || '')) continue;
        const path = 'ppt/' + (r.getAttribute('Target') || '').replace('../', ''); const ext = path.split('.').pop().toLowerCase();
        if (!['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext) || !zip.file(path)) continue;
        blocks.push({ type: 'img', src: `data:image/${ext === 'jpg' ? 'jpeg' : ext};base64,` + await zip.file(path).async('base64') });
      }
    }
    blocks.push({ type: 'pagebreak' });
  }
  return blocks;
}

      const sc = Math.min(1, 2400 / Math.max(el.naturalWidth, el.naturalHeight)); let w = Math.round(el.naturalWidth * sc), hh = Math.round(el.naturalHeight * sc);
      const swap = im.rot % 180; const c = document.createElement('canvas'); c.width = swap ? hh : w; c.height = swap ? w : hh; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.translate(c.width / 2, c.height / 2); x.rotate(im.rot * Math.PI / 180);
      if (filt && filt.value === 'gray') x.filter = 'grayscale(1) contrast(1.35) brightness(1.08)';
      x.drawImage(el, -w / 2, -hh / 2, w, hh); x.setTransform(1, 0, 0, 1, 0, 0); x.filter = 'none';
      if (filt && filt.value === 'bw') { const d = x.getImageData(0, 0, c.width, c.height); for (let k = 0; k < d.data.length; k += 4) { const g = d.data[k] * .3 + d.data[k + 1] * .59 + d.data[k + 2] * .11; const v = g > 150 ? 255 : g < 90 ? 0 : (g - 90) * 4.25; d.data[k] = d.data[k + 1] = d.data[k + 2] = v; } x.putImageData(d, 0, 0); }
      const emb = await out.embedJpg(await canvasBytes(c, 'image/jpeg', 0.88)); const m = +marg.value;

      const page = out.addPage([pw, ph]); const s2 = Math.min((pw - 2 * m) / c.width, (ph - 2 * m) / c.height); const dw = c.width * s2, dh = c.height * s2;

async function extractPageTexts(doc, onProg) {
  const out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    if (onProg) onProg(i);
    const tc = await (await doc.getPage(i)).getTextContent(); let t = '';
    for (const it of tc.items) t += it.str + (it.hasEOL ? '\n' : '');
    out.push(t);
  }
  return out;
}

  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { fit(); drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); x.strokeStyle = col.value; x.lineWidth = 5; x.beginPath(); x.moveTo(...last); x.lineTo(last[0] + .1, last[1] + .1); x.stroke(); });

  const end = () => drawing = false; c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  const el = panel('Draw your signature', c, h('div', { class: 'row', style: 'margin-top:10px' }, col, btn('Clear', () => { fit(); x.clearRect(0, 0, c.width, c.height); }, 'small'), btn('Use this signature', () => {

    for (let i = 0; i < c.height; i++) for (let j = 0; j < c.width; j++) if (d[(i * c.width + j) * 4 + 3] > 20) { if (j < x0) x0 = j; if (j > x1) x1 = j; if (i < y0) y0 = i; if (i > y1) y1 = i; }

  const doc = await pdfjsOpen(ctx.bytes); let zoom = 1; const box = h('div', { class: 'vpages' }); const hits = h('div'); const q = inp('search', '', { placeholder: 'Search in this PDF' }); let texts = null; let io;

tool('compare', 'Tools', 'Compare PDFs', 'See what changed between two files', 'compare', root => {
  const slots = [null, null]; const res = h('div');
  const mk = i => { const a = h('div'); const set = async fs => { const f = fs[0]; const bytes = await readBuf(f); slots[i] = { name: f.name, bytes }; a.innerHTML = ''; a.append(fileCard({ name: f.name, size: bytes.length }, () => draw())); go.disabled = !(slots[0] && slots[1]); }; const draw = () => { a.innerHTML = ''; pickFiles(a, { accept: 'application/pdf,.pdf', label: i ? 'Newer / second PDF' : 'Original / first PDF', icon: 'doc', onFiles: fs => withBusy('Reading…', () => set(fs)) }); }; draw(); return a; };
  const diff = (a, b) => { const n = a.length, m = b.length; if (n * m > 4e6) return null; const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1)); for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]); let i = 0, j = 0; const o = []; while (i < n && j < m) { if (a[i] === b[j]) { i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) o.push(['-', a[i++]]); else o.push(['+', b[j++]]); } while (i < n) o.push(['-', a[i++]]); while (j < m) o.push(['+', b[j++]]); return o; };

    for (let i = 0; i < n; i++) {
      const a = L(t1[i] || ''), b = L(t2[i] || ''); const same = a.join('\n') === b.join('\n'); const df = same ? [] : diff(a, b); if (!same) changed++;
      const add = df ? df.filter(x => x[0] === '+').length : '?', del = df ? df.filter(x => x[0] === '-').length : '?';
      const body = h('div', null, !df && !same ? h('p', { class: 'note' }, 'This page is too long to show line by line.') : null, ...(df || []).map(([k, s]) => h('div', { class: 'dl ' + (k === '+' ? 'add' : 'del') }, (k === '+' ? '+ ' : '− ') + s)));

    }

  }), 'primary'); go.disabled = true;
  root.append(mk(0), mk(1), h('div', { class: 'row' }, go), res);
});

/* ========= home, routing, theme ========= */
const CATS = ['All', 'Organize', 'Convert', 'Edit', 'Security', 'Tools'];
const app = $('#app'); let catNow = 'All', queryNow = '';

function buildWeb() {
  const w = innerWidth, hh = innerHeight; const svg = $('#web'); svg.setAttribute('viewBox', `0 0 ${w} ${hh}`);
  const web = (cx, cy, R, a0, a1, rays, rings) => {
    let d = ''; const pts = r => [...Array(rays)].map((_, i) => { const a = (a0 + (a1 - a0) * i / (rays - 1)) * Math.PI / 180; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
    pts(R).forEach(p => d += `M${cx} ${cy}L${p[0].toFixed(1)} ${p[1].toFixed(1)}`);
    for (let k = 1; k <= rings; k++) { const r = R * k / rings; const p = pts(r); for (let i = 0; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; const vx = cx - mx, vy = cy - my; const cxp = mx + vx * 0.12, cyp = my + vy * 0.12; d += `M${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)}Q${cxp.toFixed(1)} ${cyp.toFixed(1)} ${p[i + 1][0].toFixed(1)} ${p[i + 1][1].toFixed(1)}`; } }
    return `<path d="${d}"/>`;
  };
  svg.innerHTML = web(w, 0, Math.min(w * 1.1, 520), 90, 180, 9, 7) + web(0, hh, Math.min(w * 0.9, 420), -90, 0, 8, 6);
}
function dripSvg() {
  const w = Math.max(320, Math.min(innerWidth, 760) + 32); let d = `M0 0H${w}V14`; const drips = []; let x = w;
  const seed = [0.7, 0.2, 0.9, 0.4, 0.6, 0.1, 0.8, 0.3, 0.5, 0.95, 0.15, 0.65];
  let s = '', i = 0; const parts = [];
  for (let px = 18; px < w - 10; px += 34 + seed[i % 12] * 40, i++) { const len = 12 + seed[(i * 5) % 12] * 34; const wd = 5 + seed[(i * 7) % 12] * 4; parts.push(`<rect x="${(px - wd / 2).toFixed(1)}" y="8" width="${wd.toFixed(1)}" height="${len.toFixed(1)}" rx="${(wd / 2).toFixed(1)}"/><circle cx="${px.toFixed(1)}" cy="${(8 + len + 2).toFixed(1)}" r="${(wd * 0.75).toFixed(1)}"/>`); }
  return `<svg class="drip" viewBox="0 0 ${w} 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H${w}V10Q${w * .85} 18 ${w * .65} 10T${w * .3} 12T0 9Z"/>${parts.join('')}</svg>`;
}

function topbar(left) {

  app.append(h('section', { class: 'hero' }, h('h1', { html: 'Every PDF tool.<br><em>Zero uploads.</em>' }), h('p', null, 'Merge, split, sign, convert and more. Your files stay on this phone.'), h('div', { class: 'pills' }, h('span', { class: 'pill' }, h('b', null, TOOLS.length), ' tools'), h('span', { class: 'pill' }, 'Works offline after load'), h('span', { class: 'pill' }, 'No sign-up'))), h('div', { html: dripSvg() }));
  const search = h('input', { class: 'search', type: 'search', placeholder: 'Search tools', 'aria-label': 'Search tools', value: queryNow, style: `background-image:url("data:image/svg+xml,${encodeURIComponent('<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' width=\'18\' height=\'18\' fill=\'none\' stroke=\'#a68e94\' stroke-width=\'2\' stroke-linecap=\'round\'><path d=\'' + ICONS.search + '\'/></svg>')}")` });

  app.append(h('div', { class: 'foot' }, 'Install on your Moto G96: open this page in Chrome, tap ⋮ and choose Add to Home screen.', h('br'), 'All processing happens in your browser. Nothing is uploaded.'));
  scrollTo(0, 0);
}
function openTool(id) {

  app.append(h('div', { class: 'thead' }, h('div', { class: 'ti' }, ico(t.icon)), h('div', null, h('h1', null, t.name), h('p', null, t.desc))));

function route() { const m = location.hash.match(/^#tool-([a-z0-9]+)$/); if (m) openTool(m[1]); else home(); }
try { const th = localStorage.getItem('nw_theme'); if (th) { document.documentElement.dataset.theme = th; document.querySelector('meta[name=theme-color]').content = th === 'light' ? '#f8f2f3' : '#0a0507'; } } catch (e) { }
buildWeb(); addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(buildWeb, 200); });
addEventListener('hashchange', route); route();
